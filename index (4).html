<title>Eldoria Care at Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: demo switcher bar on top; client & staff apps in a phone-width column, admin as sidebar + workspace. Brand from the Eldoria logo: navy ground, orange "+" accent. */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --surface-2:#EAF0F7; --line:#DCE3EC;
  --fg:#14233A; --muted:#566275;
  --nav:#0A2342; --nav-fg:#FFFFFF; --nav-muted:#C3D0E3;
  --brand-bg:#0E2F5A; --brand-ink:#FFFFFF; --brand-fg:#0E2F5A;
  --accent:#F2A01F; --accent-ink:#0A2342;
  --wa:#128C4A; --wa-ink:#FFFFFF;
  --ok:#1E6B42; --ok-bg:#E3F4EA; --warn:#8A5000; --warn-bg:#FDF0D9;
  --bad:#A12B2B; --bad-bg:#FBE7E7; --info:#0E2F5A; --info-bg:#E4ECF7;
  --skin:#F5D39A; --shadow:0 8px 24px rgba(14,47,90,.10);
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1524; --surface:#12203A; --surface-2:#1A2C4A; --line:#27395A;
  --fg:#E8EEF7; --muted:#A6B3C7; --nav:#07101E; --nav-fg:#FFFFFF; --nav-muted:#A6B3C7;
  --brand-bg:#2C5EA3; --brand-ink:#FFFFFF; --brand-fg:#9EC2F0;
  --accent:#F2A01F; --accent-ink:#0A2342; --wa:#178F50; --wa-ink:#FFFFFF;
  --ok:#78D6A2; --ok-bg:#123826; --warn:#F5C46F; --warn-bg:#3A2A0C;
  --bad:#F2A0A0; --bad-bg:#3E1717; --info:#9EC2F0; --info-bg:#1A2C4A;
  --skin:#E7C27F; --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1524; --surface:#12203A; --surface-2:#1A2C4A; --line:#27395A;
  --fg:#E8EEF7; --muted:#A6B3C7; --nav:#07101E; --nav-fg:#FFFFFF; --nav-muted:#A6B3C7;
  --brand-bg:#2C5EA3; --brand-ink:#FFFFFF; --brand-fg:#9EC2F0;
  --accent:#F2A01F; --accent-ink:#0A2342; --wa:#178F50; --wa-ink:#FFFFFF;
  --ok:#78D6A2; --ok-bg:#123826; --warn:#F5C46F; --warn-bg:#3A2A0C;
  --bad:#F2A0A0; --bad-bg:#3E1717; --info:#9EC2F0; --info-bg:#1A2C4A;
  --skin:#E7C27F; --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-fg)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
/* top switcher */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav);color:var(--nav-fg);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar img{width:36px;height:36px;border-radius:50%;background:#fff}
.brandname{font-weight:800;font-size:17px}.brandname b{color:var(--accent)}
.roles{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:4px;border-radius:12px;margin-left:auto;flex-wrap:wrap}
.roles button{border:0;background:transparent;color:var(--nav-muted);padding:8px 14px;border-radius:9px;font-weight:600;cursor:pointer;min-height:38px}
.roles button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:800}
.mode{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--nav-muted)}
.mode.live{color:#9BE3B9}
@media (max-width:620px){.topbar{gap:8px;padding:8px 12px}.topbar .small{display:none}.roles{margin-left:0;width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.roles button{padding:6px 4px;font-size:13px}.mode{margin-left:auto}}
/* shared atoms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--brand-fg)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800}
.btn-brand{background:var(--brand-bg);border-color:var(--brand-bg);color:var(--brand-ink)}
.btn-wa{background:var(--wa);border-color:var(--wa);color:var(--wa-ink)}
.btn-danger{color:var(--bad);border-color:var(--bad-bg)}
.btn-sm{min-height:36px;padding:0 12px;border-radius:10px;font-size:13px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:44px;height:44px;padding:0;border-radius:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--info-bg);color:var(--info)}
.p-mute{background:var(--surface-2);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--skin);color:#0E2F5A;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input{width:100%;min-height:46px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg)}
.input:focus{border-color:var(--brand-fg);outline:none}
textarea.input{min-height:84px;resize:vertical}
.row{display:flex;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:grid;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px}
.seg button{border:0;background:transparent;min-height:42px;border-radius:10px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand-fg);font-weight:800;box-shadow:0 1px 3px rgba(14,47,90,.18)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:42px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{border:2px solid var(--brand-fg);background:var(--info-bg);color:var(--brand-fg);font-weight:800}
.chip:disabled{opacity:.45;cursor:not-allowed}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{color:var(--fg)}
.sec-title{font-size:17px;font-weight:800}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.popup{position:fixed;z-index:60;top:calc(72px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(420px,calc(100% - 24px));background:var(--nav);color:#fff;border:2px solid var(--accent);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 16px 40px rgba(0,0,0,.35);animation:popIn .25s ease-out}
@keyframes popIn{from{transform:translate(-50%,-12px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
.pulse{width:40px;height:40px;flex-shrink:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;animation:ring 1.2s ease-in-out 3}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--nav);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600}
/* phone shell */
.phone-wrap{padding:20px 16px 40px;display:flex;justify-content:center}
.phone{width:100%;max-width:430px;min-height:780px;background:var(--bg);border:1px solid var(--line);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
@media (max-width:520px){.phone-wrap{padding:0}.phone{border:0;border-radius:0;box-shadow:none;min-height:calc(100vh - 60px)}}
.ph-body{flex:1;padding:18px 16px 20px;display:flex;flex-direction:column;gap:18px}
.ph-head{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.ph-head h2{font-size:18px;font-weight:800}
.tabbar{position:sticky;bottom:0;display:grid;background:var(--surface);border-top:1px solid var(--line);padding:6px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-height:52px;cursor:pointer;position:relative}
.tabbar button[aria-current="page"]{color:var(--brand-fg);font-weight:800}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;border-radius:999px;padding:0 6px;min-width:18px}
.hero{background:var(--brand-bg);color:var(--brand-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero .eyebrow{color:var(--accent)}
.svc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;font-weight:600;font-size:13px;line-height:1.25;min-height:108px}
.svc:hover{border-color:var(--brand-fg)}
.svc .ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--info-bg);color:var(--brand-fg)}
.svc:nth-child(even) .ic{background:var(--warn-bg);color:var(--warn)}
.listitem{display:flex;gap:12px;align-items:center;padding:14px;cursor:pointer;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.listitem:hover{border-color:var(--brand-fg)}
.grow{flex:1;min-width:0}
.title{font-weight:700}
.dates{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dates button{min-height:62px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dates button span{font-size:11px;font-weight:600;color:var(--muted)}
.dates button b{font-size:17px}
.dates button[aria-pressed="true"]{background:var(--brand-bg);border-color:var(--brand-bg);color:var(--brand-ink)}
.dates button[aria-pressed="true"] span{color:var(--brand-ink)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slots button{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.slots button[aria-pressed="true"]{background:var(--brand-bg);border-color:var(--brand-bg);color:var(--brand-ink)}
.footer-bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center}
.timeline{display:flex;flex-direction:column}
.tl{display:flex;gap:12px}
.tl .rail{display:flex;flex-direction:column;align-items:center;width:22px}
.tl .node{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:#fff}
.tl.done .node{background:var(--ok);border-color:var(--ok)}
.tl.cur .node{border:6px solid var(--accent)}
.tl .line{width:2px;flex:1;min-height:16px;background:var(--line)}
.tl.done .line{background:var(--ok)}
.tl:last-child .line{display:none}
.tl .txt{padding-bottom:14px}
.check{display:flex;gap:12px;align-items:center;min-height:44px;cursor:pointer;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--ok)}
.toggle{width:50px;height:30px;border-radius:15px;border:0;padding:3px;background:var(--line);cursor:pointer;display:flex}
.toggle span{width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle[aria-checked="true"]{background:var(--ok)}
.toggle[aria-checked="true"] span{transform:translateX(20px)}
/* admin */
.admin{display:flex;min-height:calc(100vh - 60px)}
.side{width:240px;flex-shrink:0;background:var(--nav);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.side button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;border:0;background:transparent;color:var(--nav-muted);font-weight:500;cursor:pointer;text-align:left}
.side button[aria-current="page"]{background:rgba(255,255,255,.1);color:#fff;font-weight:700}
.side .badge{position:static;margin-left:auto}
.main{flex:1;min-width:0;padding:24px 28px 48px;display:flex;flex-direction:column;gap:20px;max-width:1280px}
.main-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.main-head h1{font-size:26px;font-weight:800;flex:1;min-width:200px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-size:30px;font-weight:800}
.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;align-items:start}
.panel-h{padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:16px;font-weight:800;flex:1}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 14px;background:var(--surface-2);white-space:nowrap}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
.mobile-nav{display:none}
@media (max-width:900px){
  .side{display:none}.mobile-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .split{grid-template-columns:minmax(0,1fr)}.main{padding:18px 16px 40px}
}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.drawer{padding:18px;display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.confirm{background:var(--bad-bg);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--bad);font-weight:600}
/* ================= Motion & polish ================= */
.topbar{background:linear-gradient(90deg,#071A33 0%,#0E2F5A 55%,#15467F 100%);box-shadow:0 2px 18px rgba(4,14,30,.35)}
.mode.live::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ADE80;margin-right:6px;vertical-align:1px;animation:livePulse 1.8s ease-out infinite}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}100%{box-shadow:0 0 0 8px rgba(74,222,128,0)}}
.roles button{transition:background .2s,color .2s,transform .15s}
.roles button:active{transform:scale(.96)}
/* animated "video" scene: drifting light, heartbeat line, rising care icons */
.scene{position:relative;overflow:hidden;isolation:isolate;color:#fff;background:linear-gradient(140deg,#071A33 0%,#0E2F5A 42%,#1B4F8E 100%)}
.scene-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3;opacity:.55}
.scene-shade{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(7,26,51,.35),rgba(7,26,51,.75))}
.blob{position:absolute;border-radius:50%;filter:blur(38px);z-index:-1;animation:drift 14s ease-in-out infinite alternate;pointer-events:none}
.blob.b1{width:260px;height:260px;background:#2F7BD9;opacity:.55;top:-90px;left:-70px}
.blob.b2{width:220px;height:220px;background:#F2A01F;opacity:.32;bottom:-110px;right:-50px;animation-duration:18s}
.blob.b3{width:170px;height:170px;background:#62B6FF;opacity:.28;top:28%;right:18%;animation-duration:22s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(46px,26px) scale(1.18)}100%{transform:translate(-24px,54px) scale(.92)}}
.ecg{position:absolute;left:0;width:100%;height:64px;z-index:-1;pointer-events:none}
.ecg path{fill:none;stroke:#F2A01F;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:640;stroke-dashoffset:640;filter:drop-shadow(0 0 5px rgba(242,160,31,.85));animation:ecg 3.4s linear infinite}
@keyframes ecg{0%{stroke-dashoffset:640;opacity:1}72%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.floaty{position:absolute;bottom:-34px;color:rgba(255,255,255,.22);z-index:-1;pointer-events:none;animation:rise 10s linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:1}85%{opacity:.9}100%{transform:translateY(-460px) rotate(50deg);opacity:0}}
.ticker{height:1.45em;overflow:hidden;position:relative}
.ticker span{display:block;height:1.45em;line-height:1.45em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:tick 14s cubic-bezier(.7,0,.3,1) infinite}
@keyframes tick{0%,21%{transform:translateY(0)}25%,46%{transform:translateY(-100%)}50%,71%{transform:translateY(-200%)}75%,96%{transform:translateY(-300%)}100%{transform:translateY(-400%)}}
.logo-glow{animation:glow 3.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 6px rgba(255,255,255,.14),0 0 28px rgba(242,160,31,.25)}50%{box-shadow:0 0 0 11px rgba(255,255,255,.07),0 0 64px rgba(242,160,31,.6)}}
.shine{position:relative;overflow:hidden;background:linear-gradient(135deg,#F8B544 0%,#F2A01F 55%,#E68A0A 100%);border-color:transparent}
.shine::after{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine 3.8s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,62%{left:-70%}100%{left:135%}}
.hero.scene{border-radius:22px;padding:20px;box-shadow:0 14px 34px rgba(7,26,51,.35)}
.hero.scene .eyebrow{color:#FFC765}
/* cards & tiles */
.btn{transition:transform .15s,box-shadow .2s,border-color .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn-accent:hover,.btn-brand:hover,.btn-wa:hover{box-shadow:0 6px 18px rgba(14,47,90,.22)}
.svc{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,border-color .22s;box-shadow:0 1px 2px rgba(14,47,90,.06)}
.svc:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(14,47,90,.14)}
.svc .ic{transition:transform .3s cubic-bezier(.3,1.6,.5,1);box-shadow:inset 0 0 0 1px rgba(14,47,90,.06)}
.svc:hover .ic{transform:scale(1.12) rotate(-6deg)}
.listitem{transition:transform .18s,box-shadow .2s,border-color .2s}
.listitem:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(14,47,90,.10)}
.card.kpi{position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.card.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card.kpi::before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--brand-fg),var(--accent))}
.tabbar button{transition:color .2s}
.tabbar button[aria-current="page"]::before{content:'';position:absolute;top:-6px;width:30px;height:4px;border-radius:0 0 4px 4px;background:var(--accent);animation:tabIn .3s ease-out}
.tabbar button[aria-current="page"] svg{animation:tabPop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes tabIn{from{width:0}to{width:30px}}
@keyframes tabPop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.side button{transition:background .2s,color .2s,padding-left .2s}
.side button:hover{background:rgba(255,255,255,.06);color:#fff;padding-left:16px}
.side button[aria-current="page"]{box-shadow:inset 3px 0 0 var(--accent)}
/* screen entrance (only when the screen changes, not on every data update) */
.enter .phone{animation:screenIn .38s cubic-bezier(.2,.8,.2,1) both}
.enter .ph-body>*,.enter .main>*,.enter .kpis>*,.enter .svc-grid>*{animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both}
.enter .ph-body>*:nth-child(2),.enter .main>*:nth-child(2),.enter .kpis>*:nth-child(2),.enter .svc-grid>*:nth-child(2){animation-delay:.05s}
.enter .ph-body>*:nth-child(3),.enter .main>*:nth-child(3),.enter .kpis>*:nth-child(3),.enter .svc-grid>*:nth-child(3){animation-delay:.1s}
.enter .ph-body>*:nth-child(4),.enter .main>*:nth-child(4),.enter .kpis>*:nth-child(4),.enter .svc-grid>*:nth-child(4){animation-delay:.15s}
.enter .ph-body>*:nth-child(5),.enter .main>*:nth-child(5),.enter .svc-grid>*:nth-child(5){animation-delay:.2s}
.enter .ph-body>*:nth-child(n+6),.enter .main>*:nth-child(n+6),.enter .svc-grid>*:nth-child(n+6){animation-delay:.25s}
@keyframes screenIn{from{opacity:.3;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* intro "video" splash */
.intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;animation:introOut .6s ease-in 3.1s forwards}
.intro img{width:150px;height:150px;border-radius:50%;background:#fff;animation:logoIn 1.1s cubic-bezier(.2,1.4,.4,1) both,glow 3.2s ease-in-out 1.1s infinite}
.intro h1{font-size:clamp(26px,6vw,40px);font-weight:800;color:#fff;animation:fadeUp .7s ease-out .7s both}
.intro h1 b{color:var(--accent)}
.intro p{margin:0;color:#C9D6E8;font-size:17px;animation:fadeUp .7s ease-out 1.1s both}
.intro .ecg{position:relative;width:min(520px,90vw);height:64px;z-index:0}
.intro .ecg path{animation:ecg 2.2s linear .4s infinite}
.intro .skip{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px));background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}
@keyframes logoIn{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes introOut{to{opacity:0;visibility:hidden;transform:scale(1.04)}}
/* booking success celebration */
.celebrate{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:rgba(7,26,51,.55);backdrop-filter:blur(3px);animation:fadeIn .25s ease-out,introOut .45s ease-in 2.6s forwards}
.celebrate .box{position:relative;background:var(--surface);color:var(--fg);border-radius:24px;padding:28px 26px;width:min(340px,calc(100% - 32px));text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:logoIn .55s cubic-bezier(.2,1.4,.4,1)}
.check-anim{width:84px;height:84px}
.check-anim circle{fill:none;stroke:var(--ok);stroke-width:5;stroke-dasharray:260;stroke-dashoffset:260;animation:draw .6s ease-out .1s forwards}
.check-anim path{fill:none;stroke:var(--ok);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;stroke-dashoffset:70;animation:draw .4s ease-out .6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.confetti{position:absolute;top:30%;left:50%;width:9px;height:14px;border-radius:2px;opacity:0;animation:burst 1.3s cubic-bezier(.1,.7,.3,1) .45s forwards}
@keyframes burst{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.count{display:inline-block}
/* single-panel builds hide the demo switcher */
body.locked .roles{display:none}
@media (max-width:700px){body.locked .topbar>div:not(.roles){display:block}body.locked .topbar .small{display:block!important}body.locked .mode{margin-left:auto}}
body.locked .mode{margin-left:auto}
#app{overflow-x:hidden;overflow-x:clip}
/* ================= Services, categories, help requests ================= */
.search-box{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--muted)}
.search-box:focus-within{border-color:var(--brand-fg)}
.search-box input{border:0;outline:none;background:transparent;flex:1;min-width:0;font-size:16px;color:var(--fg)}
.notsure{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:18px;border:2px solid var(--accent);background:linear-gradient(135deg,var(--warn-bg),var(--surface));color:var(--fg);cursor:pointer;box-shadow:0 8px 20px rgba(242,160,31,.18);transition:transform .2s,box-shadow .2s}
.notsure:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(242,160,31,.25)}
.ns-ic{width:48px;height:48px;flex-shrink:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.ns-t{display:block;font-weight:800;font-size:17px}.ns-s{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
.notsure.small-ns{padding:12px;box-shadow:none}.small-ns .ns-ic{width:40px;height:40px}.small-ns .ns-t{font-size:15px}
.cat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cat-tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;min-height:118px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-align:left;cursor:pointer;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,border-color .22s}
.cat-tile:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(14,47,90,.12);border-color:var(--brand-fg)}
.cat-tile .ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--info-bg);color:var(--brand-fg)}
.cat-tile:nth-child(4n+2) .ic,.cat-tile:nth-child(4n+3) .ic{background:var(--warn-bg);color:var(--warn)}
.ct-name{font-weight:800;font-size:15px;line-height:1.25}.ct-sub{font-size:12px;color:var(--muted);font-weight:600}
.cat-tile.soon{background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 10px,var(--surface-2) 10px,var(--surface-2) 20px)}
.svc-card{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.svc-card.soon{opacity:.8}
.svc-ic{width:46px;height:46px;flex-shrink:0;border-radius:14px;background:var(--info-bg);color:var(--brand-fg);display:flex;align-items:center;justify-content:center;overflow:hidden}
.svc-ic.lg{width:72px;height:72px;border-radius:18px}.svc-ic.sm{width:40px;height:40px;border-radius:12px}
.svc-img{object-fit:cover;border-radius:inherit;display:block}
.price-tag{font-weight:800;font-size:14px;color:var(--brand-fg);white-space:nowrap}
.soon-banner{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--warn-bg);color:var(--warn)}
.sheet-bg{position:fixed;inset:0;z-index:70;background:rgba(7,26,51,.5);animation:fadeIn .2s}
.sheet{position:fixed;z-index:71;left:50%;bottom:0;transform:translateX(-50%);width:min(430px,100%);background:var(--surface);color:var(--fg);border-radius:24px 24px 0 0;padding:12px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:sheetUp .3s cubic-bezier(.2,.8,.2,1)}
.sheet-grab{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center}
@keyframes sheetUp{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.up-tile{width:72px;height:72px;border:1.5px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--brand-fg);cursor:pointer;background:var(--surface)}
.icon-pick{display:flex;flex-wrap:wrap;gap:6px}
.icon-pick button{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--brand-fg);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-pick button[aria-pressed="true"]{border:2px solid var(--brand-fg);background:var(--info-bg)}
.editor{border:2px solid var(--brand-fg)}
.cat-block{overflow:hidden}.cat-block.off{opacity:.7}
.cat-head{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--surface-2);flex-wrap:wrap}
.svc-rows{display:flex;flex-direction:column}
.svc-row{display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.svc-row.off{opacity:.6}
.ord{gap:6px;flex-wrap:wrap}.ord .icon-btn{width:34px;height:34px;min-height:34px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:700px){.svc-row .ord{width:100%;justify-content:flex-end}.cat-head .ord{width:100%;justify-content:flex-end}.svc-row .grow{flex-basis:60%}}
/* ================= Staff onboarding ================= */
.join-card{border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;color:#fff;background:linear-gradient(135deg,#0E2F5A 0%,#1B4F8E 60%,#2A63A8 100%);box-shadow:0 12px 28px rgba(14,47,90,.25);position:relative;overflow:hidden}
.join-card::after{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(242,160,31,.45),transparent 70%);animation:drift 12s ease-in-out infinite alternate;pointer-events:none}
.ob-progress{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:10px 16px 0;background:var(--surface)}
.ob-progress span{height:5px;border-radius:3px;background:var(--line);transition:background .3s}
.ob-progress span.on{background:linear-gradient(90deg,var(--brand-fg),var(--accent))}
.doc-row{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px dashed var(--line);border-radius:16px;background:var(--surface);transition:border-color .2s}
.doc-row.done{border-style:solid;border-color:var(--ok)}
.doc-ph{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:12px;background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:800;text-align:center;padding:4px}
.doc-ph.pdf{background:var(--bad-bg);color:var(--bad);font-size:15px;letter-spacing:.05em}
.doc-ph.spin svg{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.doc-img{object-fit:cover;border-radius:12px;flex-shrink:0;display:block;background:var(--surface-2)}
.req{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);padding:2px 7px;border-radius:999px;margin-left:4px}
.doc-strip{display:flex;gap:12px;flex-wrap:wrap}
.doc-mini{display:flex;flex-direction:column;align-items:center;gap:4px;width:76px;text-align:center;line-height:1.2}
.wrap-btns{flex-wrap:wrap}.wrap-btns .btn{white-space:normal;line-height:1.2;text-align:center;min-width:140px}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.app-card{display:flex;flex-direction:column;gap:10px;padding:16px;text-align:left;cursor:pointer;color:var(--fg);font:inherit;transition:transform .2s,box-shadow .2s,border-color .2s}
.app-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--brand-fg)}
.photo-lg{width:104px;height:104px;border-radius:20px;overflow:hidden;border:0;padding:0;background:var(--skin);color:#0E2F5A;font-size:32px;font-weight:800;cursor:zoom-in;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.photo-lg .doc-img{border-radius:0}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.doc-tile{display:flex;flex-direction:column;gap:6px;padding:12px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);min-width:0}
.doc-tile.ok{border-color:var(--ok);background:linear-gradient(180deg,var(--ok-bg),var(--surface) 55%)}
.doc-view{border:0;padding:0;background:none;cursor:zoom-in;align-self:center;border-radius:12px}
.doc-view:disabled{cursor:default}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--info-bg);color:var(--info);margin:0 4px 4px 0}
.lightbox{position:fixed;inset:0;z-index:120;background:rgba(4,12,24,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:56px 16px 24px;cursor:zoom-out;animation:fadeIn .2s ease-out}
.lightbox img{max-width:100%;max-height:calc(100% - 40px);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:logoIn .3s ease-out}
.lb-close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px}
.lb-cap{color:#C9D6E8;font-size:13px}
/* ================= Mobile-first screens ================= */
html{-webkit-tap-highlight-color:transparent}
.phone{overflow:hidden;overflow:clip}
.ph-head{position:sticky;top:0;z-index:6}
.chip-row{min-width:0;max-width:100%;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip-row::-webkit-scrollbar{display:none}
.chip-row .chip{flex-shrink:0;white-space:nowrap}
@media (max-width:700px){
  /* app-like layout: header scrolls away, screen header & tabs stay pinned */
  .topbar{position:relative;top:auto;padding:8px 12px;gap:8px;flex-wrap:nowrap}
  .topbar>img{width:32px;height:32px}
  .topbar>div:not(.roles){display:none}
  .mode{order:3;margin-left:0;width:12px;height:12px;padding:0;font-size:0;background:none;overflow:hidden;flex-shrink:0}
  .mode::before{margin:0}
  .roles{flex:1;margin-left:0;width:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .roles button{padding:6px 4px;font-size:13px;min-height:36px}
  .phone-wrap{padding:0}
  .phone{border:0;border-radius:0;box-shadow:none;min-height:calc(100vh - 52px);min-height:calc(100dvh - 52px);max-width:none}
  .ph-body{padding:16px 14px 20px;gap:16px}
  .tabbar{z-index:6;box-shadow:0 -6px 20px rgba(14,47,90,.08)}
  .footer-bar{z-index:6;box-shadow:0 -6px 20px rgba(14,47,90,.10)}
  .input,select.input,textarea.input{font-size:16px}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .popup{top:calc(10px + env(safe-area-inset-top,0px));width:calc(100% - 20px)}
  .hero.scene{padding:18px 16px}
  .hero .ticker{font-size:18px}
  .seg button{font-size:13px;padding:0 4px;line-height:1.15}
  .dates{gap:4px}.dates button{min-height:58px}
  .svc{min-height:100px;padding:12px 4px 10px}
  .kv{grid-template-columns:96px minmax(0,1fr)}
  .req-banner .pill{display:none}
  /* admin */
  .main{padding:12px 14px 40px;gap:16px}
  .mobile-nav{position:sticky;top:0;z-index:7;margin:-12px -14px 0;padding:10px 14px;background:var(--bg);box-shadow:0 6px 14px -10px rgba(14,47,90,.35)}
  .mobile-nav .chip{min-height:38px;padding:0 14px;font-size:14px;flex-shrink:0;white-space:nowrap}
  .mobile-nav{scrollbar-width:none}.mobile-nav::-webkit-scrollbar{display:none}
  .main-head{gap:10px}
  .main-head h1{font-size:21px;min-width:0}
  .main-head .btn{min-height:40px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:14px}
  .kpi b{font-size:26px}
  .split>section.stack{order:-1}
  .bk-tools{flex-direction:column;align-items:stretch}
  .bk-tools .input{max-width:none!important}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .drawer{padding:16px}
  /* tables become stacked cards */
  .tbl-wrap{overflow:visible}
  .tbl-wrap table{min-width:0!important}
  .tbl-wrap thead{display:none}
  .tbl-wrap tr{display:block;padding:12px 14px;border-top:1px solid var(--line)}
  .tbl-wrap tr:first-child{border-top:0}
  .tbl-wrap td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0;border:0;text-align:right!important}
  .tbl-wrap td::before{content:attr(data-label);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;flex-shrink:0}
  .tbl-wrap td:first-child{display:block;text-align:left!important;padding:0 0 6px;font-size:15px}
  .tbl-wrap td:first-child::before{display:none}
  .tbl-wrap td[data-label=""]::before{display:none}
  .tbl-wrap td .row{justify-content:flex-end}
  .tdv{min-width:0;text-align:right}
  .hide-sm{display:none}
  .tbl-wrap td select.input{max-width:60%!important}
  tr.click:hover td{background:none}
}
@media (max-width:360px){
  .roles button{font-size:12px}
  .svc-grid{gap:8px}
  .svc{font-size:12px}
  .kpis{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.intro{display:none}.celebrate{display:none}}
</style>

</head>

/* ---------- data layer ----------
   1) Inside Claude: shared live database (all viewers see the same data).
   2) Standalone file / own hosting: saved in this browser (localStorage) and
      synced live between tabs, so Client, Staff and Admin can run side by side. */
const COLS=['bookings','staff','notifications','services','settings','cities','categories','enquiries'];
const D={};COLS.forEach(c=>D[c]={});
let db=null,live=false,local=false;
const STORE_KEY='eldoria:data:v1';
function saveLocal(){if(!local)return;try{localStorage.setItem(STORE_KEY,JSON.stringify(D))}catch(e){toast('Browser storage is full or blocked. Changes may not be kept.')}}
function loadLocal(){try{const raw=localStorage.getItem(STORE_KEY);if(!raw)return true;const o=JSON.parse(raw);COLS.forEach(c=>D[c]=o[c]||{});return true}catch(e){return false}}
async function put(col,id,data){
  D[col][id]={...data,id};saveLocal();render();
  if(db){try{await db.collection(col).doc(id).set(stripId(data))}catch(e){fail(e)}}
}
async function patch(col,id,data){
  const cur=D[col][id]||{};D[col][id]={...cur,...data,id};saveLocal();render();
  if(db){try{await db.collection(col).doc(id).set(stripId(D[col][id]))}catch(e){fail(e)}}
}
async function remove(col,id){delete D[col][id];saveLocal();render();if(db){try{await db.collection(col).doc(id).delete()}catch(e){fail(e)}}}
const stripId=o=>{const c={...o};delete c.id;return c};
function fail(e){toast(e&&e.code==='quota_exceeded'?'Storage is full. Delete old records in Admin to continue.':'Could not save. Check your connection and try again.')}
async function connect(){
  const modeEl=document.getElementById('mode');
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){
    let first=false;try{first=!localStorage.getItem(STORE_KEY)}catch(e){}
    local=loadLocal();
    if(local&&first)loadDemo();
    else if(local)ensureCatalog();
    if(local){
      modeEl.textContent='Saved on this device';modeEl.classList.add('live');
      window.addEventListener('storage',e=>{if(e.key===STORE_KEY){loadLocal();scheduleRender()}});
    }else modeEl.textContent='Offline demo · data not saved';
    render();return}
  live=true;modeEl.textContent='Live data';modeEl.classList.add('live');
  const seen=new Set();let seeded=false;
  COLS.forEach(c=>db.collection(c).onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]={...d.data(),id:d.id}});D[c]=m;
    if(!snap.metadata.fromCache)seen.add(c);
    if(!seeded&&seen.size===COLS.length){seeded=true;if(COLS.every(k=>!Object.keys(D[k]).length))loadDemo();else ensureCatalog()}
    scheduleRender();
  },()=>{}));
}

function clientView(){
  if(!clientUser)return phone(clientLogin());
  const c=S.c;let body='';
  if(c.screen==='book')return phone(bookScreen(),false);
  if(c.screen==='cat')return phone(catScreen(c.param))+soonSheet();
  if(c.screen==='help')return phone(helpScreen());
  if(c.screen==='helpdone')return phone(helpDoneScreen(c.param));
  if(c.screen==='booking')return phone(bookingScreen(c.param),false);
  if(c.screen==='bookings')body=clientBookings();
  else if(c.screen==='alerts')body=alertsScreen('client:'+clientUser.phone,'client');
  else if(c.screen==='profile')body=clientProfile();
  else body=clientHome();
  return soonSheet()+phone(body+tabbar([['home','home','Home'],['bookings','cal','Bookings'],['alerts','bell','Alerts',unread('client:'+clientUser.phone)],['profile','user','Profile']],c.screen,'cnav'));
}
const phone=(inner)=>`<div class="phone-wrap"><div class="phone">${inner}</div></div>`;
function tabbar(items,cur,act){
  return `<nav class="tabbar" style="grid-template-columns:repeat(${items.length},minmax(0,1fr))" aria-label="App navigation">${items.map(([k,i,l,n])=>`<button type="button" data-act="${act}" data-v="${k}" ${cur===k?'aria-current="page"':''}>${ic(i,22)}${l}${n?`<span class="badge num">${n}</span>`:''}</button>`).join('')}</nav>`;
}
function head(title,backAct,sub){
  return `<div class="ph-head"><button type="button" class="btn icon-btn" style="border:0" data-act="${backAct}" aria-label="Back">${ic('back',22,2.2)}</button><div class="grow"><h2>${esc(title)}</h2>${sub?`<div class="small muted">${esc(sub)}</div>`:''}</div></div>`;
}
function careDesk(cityId){
  const g=settings();const c=citiesAll().find(x=>x.id===(cityId||(clientUser&&clientUser.city)))||{};
  const st={phone:c.phone||g.phone,whatsapp:c.whatsapp||g.whatsapp};
  if(!st.phone&&!st.whatsapp)return `<div class="small" style="color:var(--nav-muted)">Care desk number not set yet. Add it in Admin panel › Cities.</div>`;
  return `<div class="row" style="flex-wrap:wrap">${st.phone?`<a class="btn btn-accent" style="flex:1" href="${telHref(st.phone)}">${ic('phone',17,2.2)}Call ${esc(st.phone)}</a>`:''}${st.whatsapp?`<a class="btn btn-wa" style="flex:1" target="_blank" rel="noopener" href="${waHref(st.whatsapp,'Hello Eldoria, I need help with home care.')}">${ic('wa',17,2.2)}WhatsApp</a>`:''}</div>`;
}
function clientLogin(){

function clientHome(){
  const mine=bookingsAll().filter(b=>b.clientPhone===clientUser.phone);
  const next=mine.filter(b=>ACTIVE.includes(b.status)).sort(byDateTime)[0];

function bookingItem(b){
  const st=D.staff[b.staffId];
  return `<button type="button" class="listitem" data-act="openBooking" data-v="${esc(b.id)}">
   <span class="avatar">${st?esc(initials(st.name)):ic(svcB(b).icon||'cross',20)}</span>
   <span class="grow"><span class="title" style="display:block">${esc(svcB(b).name)}${st?' · '+esc(st.name.split(' ')[0]):''}</span>
   <span class="small muted" style="display:block">${esc(fmtDate(b.date))}, ${esc(b.time)} · for ${esc(b.patientName)}</span></span>${pill(b.status)}</button>`;
}

function timeline(b){
  if(b.status==='cancelled')return `<div class="confirm" style="background:var(--bad-bg)">This booking was cancelled${b.cancelReason?': '+esc(b.cancelReason):''}.</div>`;
  const idx=FLOW.indexOf(b.status);const when=s=>(b.history||[]).filter(h=>h.status===s).slice(-1)[0];
  return `<div class="timeline">${FLOW.map((s,i)=>{const done=i<idx||(i===idx&&b.status==='completed');const cur=i===idx&&!done;const h=when(s);
   return `<div class="tl ${done?'done':cur?'cur':''}"><div class="rail"><span class="node">${done?ic('check',13,3):''}</span><span class="line"></span></div><div class="txt"><div style="font-weight:700;${i>idx?'color:var(--muted)':''}">${FLOW_TXT[s]}</div><div class="small muted">${h&&i<=idx?fmtTs(h.at)+(h.by&&h.by!=='client'?' · by '+esc(actorName(h.by)):''):''}</div></div></div>`}).join('')}</div>`;
}

function staffView(){
  const me=D.staff[S.staffId];
  if(!me||apprOf(me)!=='approved'){
    if(S.s.mode==='join'&&S.ob)return phone(joinScreen());
    if(S.s.mode==='track')return phone(trackScreen());
    return phone(staffLogin());
  }
  const pop=staffCanConfirm()?newReqPopup('staff:'+me.id,openReqsFor(me),'sPopView'):'';
  if(S.s.screen==='visit')return phone(visitScreen(S.s.param))+pop;
  if(S.s.screen==='request')return phone(requestScreen(S.s.param,me))+pop;
  let body=S.s.screen==='alerts'?alertsScreen('staff:'+me.id,'staff'):S.s.screen==='profile'?staffProfile(me):S.s.screen==='requests'?staffRequests(me):staffVisits(me);
  const tabs=[['visits','list','Visits']];
  if(staffCanConfirm())tabs.push(['requests','cal','Requests',openReqsFor(me).length]);
  tabs.push(['alerts','bell','Alerts',unread('staff:'+me.id)],['profile','user','Profile']);
  return phone(body+tabbar(tabs,S.s.screen,'snav'))+pop;
}

  if(!fresh.length)return '';
  const b=fresh.slice().sort((x,y)=>(y.createdAt||0)-(x.createdAt||0))[0];const s=svcB(b);
  return `<div class="popup" role="alertdialog" aria-live="assertive" aria-labelledby="popT">
   <div class="row" style="align-items:flex-start"><span class="pulse" aria-hidden="true">${ic('bell',20,2.2)}</span>
    <div class="grow"><div class="eyebrow" style="color:var(--accent)">${b.status==='requested'?'New booking request':'Open visit · needs a caregiver'}${fresh.length>1?` · ${fresh.length} new`:''}</div>
     <div id="popT" style="font-weight:800;font-size:17px;margin-top:2px">${esc(s.name)} · ${esc(b.patientName)}${b.patientAge?', '+esc(b.patientAge):''}</div>
     <div class="small" style="color:var(--nav-muted)">${esc(fmtDate(b.date))}, ${esc(b.time)} · ${esc(cityName(bCity(b)))} · ${esc(b.plan)}</div>
     <div class="small" style="color:var(--nav-muted)">${esc(b.address)}</div></div></div>
   <div class="row"><button class="btn btn-accent grow" type="button" data-act="${viewAct}" data-v="${esc(b.id)}" data-k="${esc(seenKey)}">View request</button><button class="btn" type="button" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.3)" data-act="popLater" data-v="${esc(b.id)}" data-k="${esc(seenKey)}">Later</button></div>

function staffRequests(me){

  return `<div class="ph-body"><div><h1 style="font-size:22px;font-weight:800">Booking requests</h1><div class="small muted">Open requests in ${esc(cityName(sCity(me)))}. Confirm them, take the visit yourself or assign a colleague.</div></div>

function requestScreen(id,me){
  const b=D.bookings[id];const back=head('Booking request','snavReq');
  if(!b)return back+`<div class="ph-body"><div class="card empty"><b>Request not found</b></div></div>`;
  const s=svcB(b);
  if(!isOpenReq(b)){const st=D.staff[b.staffId];
    return back+`<div class="ph-body"><div class="card empty"><b>${b.status==='cancelled'?'This booking was cancelled':st?(st.id===me.id?'This visit is yours':'Taken by '+esc(st.name)):'No longer open'}</b>${st&&st.id===me.id?`<button class="btn btn-accent" type="button" data-act="openVisit" data-v="${esc(b.id)}">Open visit</button>`:''}${b.assignedBy?`<span class="small">Assigned by ${esc(actorName(b.assignedBy))}</span>`:''}</div></div>`}
  const local=staffList().filter(x=>x.id!==me.id&&sCity(x)===bCity(b)),other=staffList().filter(x=>x.id!==me.id&&sCity(x)!==bCity(b));
  const opt=x=>`<option value="${esc(x.id)}">${esc(x.name)} · ${esc(x.role)}${x.onDuty?'':' (off duty)'}</option>`;
  return `${back}<div class="ph-body">
   <div class="row" style="justify-content:space-between">${b.status==='requested'?'<span class="pill p-warn">New request</span>':'<span class="pill p-info">Confirmed · needs a caregiver</span>'}<span class="small muted">${esc(b.code)} · ${srcPill(b.source)}</span></div>
   <div class="card" style="padding:16px"><dl class="kv" style="margin:0"><dt>Service</dt><dd>${esc(s.name)} · ${esc(b.plan)}</dd><dt>When</dt><dd>${esc(fmtDate(b.date))}, ${esc(b.time)}</dd><dt>Patient</dt><dd>${esc(b.patientName)}${b.patientAge?', '+esc(b.patientAge):''} (${esc(b.relation)})</dd><dt>Address</dt><dd>${esc(b.address)}, ${esc(cityName(bCity(b)))}</dd><dt>Family</dt><dd>${esc(b.clientName)} · <span class="num">+91 ${esc(b.clientPhone)}</span></dd>${b.notes?`<dt>Care notes</dt><dd>${esc(b.notes)}</dd>`:''}<dt>Requested</dt><dd>${esc(fmtTs(b.createdAt))}</dd></dl></div>
   <div class="row"><a class="btn grow" href="${telHref(b.clientPhone)}">${ic('phone',17)}Call family</a><a class="btn btn-wa grow" target="_blank" rel="noopener" href="${waHref(b.clientPhone,`Hello ${b.clientName}, this is ${me.name} from Eldoria Care at Home about your ${s.name} request ${b.code}.`)}">${ic('wa',17)}WhatsApp</a></div>
   <div class="card stack" style="padding:16px"><div class="sec-title" style="font-size:15px">Take this visit</div>
    <button class="btn btn-accent btn-block" type="button" data-act="sAcceptSelf" data-v="${esc(b.id)}">${ic('check',18,2.6)}${b.status==='requested'?'Confirm &amp; assign to me':'Assign to me'}</button></div>
   <div class="card stack" style="padding:16px"><div class="sec-title" style="font-size:15px">Assign a colleague</div>
    <div class="field"><label for="sAsg">Staff member</label><select class="input" id="sAsg" data-bind="s.pick"><option value="">${local.length||other.length?'Choose a person…':'No other staff yet'}</option>${local.length?`<optgroup label="In ${esc(cityName(bCity(b)))}">${local.map(opt).join('')}</optgroup>`:''}${other.length?`<optgroup label="Other cities">${other.map(opt).join('')}</optgroup>`:''}</select></div>
    <button class="btn btn-brand btn-block" type="button" data-act="sAssignOther" data-v="${esc(b.id)}" ${local.length||other.length?'':'disabled'}>${b.status==='requested'?'Confirm &amp; assign':'Assign'}</button></div>
   ${b.status==='requested'?`<button class="btn btn-block" type="button" data-act="sConfirmOnly" data-v="${esc(b.id)}">Confirm only · care desk assigns later</button>`:''}
  </div>`;
}

/* ---------- staff onboarding (applicant side) ---------- */
const OB_STEPS=['Your details','Work profile','Documents','Review & submit'];
function obBlank(){return {step:1,id:null,agree:false,err:'',busy:{},docs:{},
  data:{name:'',phone:'',email:'',dob:'',gender:'',city:cities()[0].id,area:'',address:'',role:'',qualification:'',regNo:'',experience:'',skills:[],languages:[],availability:[],emName:'',emPhone:'',emRelation:''}}}
function obFromApp(a){const o=obBlank();o.id=a.id;o.docs={...(a.files||{})};
  Object.assign(o.data,{name:a.name||'',phone:a.phone||'',email:a.email||'',dob:a.dob||'',gender:a.gender||'',city:sCity(a),area:a.area||'',address:a.address||'',role:a.role||'',qualification:a.qualification||'',regNo:a.regNo||'',experience:String(a.experience??''),skills:a.skillList||[],languages:a.languages||[],availability:a.availability||[],emName:(a.emergency||{}).name||'',emPhone:(a.emergency||{}).phone||'',emRelation:(a.emergency||{}).relation||''});return o}
const obChips=(field,opts)=>`<div class="chips">${opts.map(o=>`<button type="button" class="chip" data-act="obToggle" data-k="${field}" data-v="${esc(o)}" aria-pressed="${S.ob.data[field].includes(o)}">${esc(o)}</button>`).join('')}</div>`;
function obValidate(step){
  const d=S.ob.data,p=digits(d.phone);
  if(step===1){
    if(!d.name.trim())return 'Enter your full name.';
    if(p.length!==10)return 'Enter a 10-digit mobile number.';
    const dup=Object.values(D.staff).find(s=>s.id!==S.ob.id&&digits(s.phone)===p&&apprOf(s)!=='rejected');
    if(dup)return apprOf(dup)==='approved'?'This mobile number already belongs to an approved staff member. Sign in instead.':'You have already applied with this number. Use "Track my application".';
    if(d.email.trim()&&!/^\S+@\S+\.\S+$/.test(d.email.trim()))return 'Enter a valid email address, or leave it empty.';
    const age=ageOf(d.dob);if(!d.dob)return 'Enter your date of birth.';if(age<18||age>70)return 'You must be between 18 and 70 years old to apply.';
    if(!d.gender)return 'Select your gender.';
    if(!d.area.trim()||!d.address.trim())return 'Enter your area and full address.';
  }
  if(step===2){
    if(!d.role)return 'Select the role you are applying for.';
    if(!d.qualification.trim())return 'Enter your highest qualification.';
    const ex=Number(d.experience);if(d.experience===''||isNaN(ex)||ex<0||ex>50)return 'Enter your years of experience (0–50).';
    if(!d.skills.length)return 'Pick at least one skill.';
    if(!d.languages.length)return 'Pick at least one language you speak.';
    if(!d.availability.length)return 'Pick when you can work.';
    if(!d.emName.trim()||digits(d.emPhone).length!==10)return 'Add an emergency contact name and 10-digit number.';
  }
  if(step===3){const miss=OB_DOCS.filter(x=>x.req&&!S.ob.docs[x.k]);if(miss.length)return 'Upload: '+miss.map(x=>x.label).join(', ')+'.';if(Object.values(S.ob.busy).some(Boolean))return 'Wait for uploads to finish.'}
  if(step===4&&!S.ob.agree)return 'Tick the declaration to submit.';
  return '';
}
function joinScreen(){
  const O=S.ob,d=O.data,st=O.step;
  let body='';
  if(st===1)body=`
   <div class="field"><label for="ob1">Full name (as on ID)</label><input class="input" id="ob1" data-bind="ob.data.name" value="${esc(d.name)}" autocomplete="name"></div>
   <div class="field"><label for="ob2">Mobile number</label><div class="row"><span class="input" style="width:auto;display:flex;align-items:center;font-weight:700">+91</span><input class="input" id="ob2" type="tel" inputmode="numeric" data-bind="ob.data.phone" value="${esc(d.phone)}" placeholder="98765 43210"></div></div>
   <div class="field"><label for="ob3">Email (optional)</label><input class="input" id="ob3" type="email" data-bind="ob.data.email" value="${esc(d.email)}"></div>
   <div class="grid2"><div class="field"><label for="ob4">Date of birth</label><input class="input" id="ob4" type="date" data-bind="ob.data.dob" value="${esc(d.dob)}"></div>
    <div class="field"><label for="ob5">Gender</label><select class="input" id="ob5" data-bind="ob.data.gender"><option value="">Select</option>${['Female','Male','Other'].map(g=>`<option ${d.gender===g?'selected':''}>${g}</option>`).join('')}</select></div></div>
   <div class="grid2"><div class="field"><label for="ob6">City</label><select class="input" id="ob6" data-bind="ob.data.city">${cityOpts(d.city)}</select></div>
    <div class="field"><label for="ob7">Area / locality</label><input class="input" id="ob7" data-bind="ob.data.area" value="${esc(d.area)}" placeholder="e.g. Andheri West"></div></div>
   <div class="field"><label for="ob8">Full address</label><textarea class="input" id="ob8" data-bind="ob.data.address">${esc(d.address)}</textarea></div>`;
  if(st===2)body=`
   <div class="stack"><div class="sec-title" style="font-size:15px">Role you're applying for</div><div class="chips">${OB_ROLES.map(r=>`<button type="button" class="chip" data-act="obSet" data-k="role" data-v="${esc(r)}" aria-pressed="${d.role===r}">${esc(r)}</button>`).join('')}</div></div>
   <div class="field"><label for="ob9">Highest qualification</label><input class="input" id="ob9" data-bind="ob.data.qualification" value="${esc(d.qualification)}" placeholder="e.g. GNM Nursing, 2019"></div>
   <div class="grid2"><div class="field"><label for="ob10">Nursing council reg. no. (if any)</label><input class="input" id="ob10" data-bind="ob.data.regNo" value="${esc(d.regNo)}"></div>
    <div class="field"><label for="ob11">Experience (years)</label><input class="input" id="ob11" inputmode="numeric" data-bind="ob.data.experience" value="${esc(d.experience)}"></div></div>
   <div class="stack"><div class="sec-title" style="font-size:15px">Skills</div>${obChips('skills',OB_SKILLS)}</div>
   <div class="stack"><div class="sec-title" style="font-size:15px">Languages you speak</div>${obChips('languages',OB_LANGS)}</div>
   <div class="stack"><div class="sec-title" style="font-size:15px">Available for</div>${obChips('availability',OB_AVAIL)}</div>
   <div class="card stack" style="padding:14px"><div class="sec-title" style="font-size:15px">Emergency contact</div>
    <div class="field"><label for="ob12">Name</label><input class="input" id="ob12" data-bind="ob.data.emName" value="${esc(d.emName)}"></div>
    <div class="grid2"><div class="field"><label for="ob13">Mobile</label><input class="input" id="ob13" type="tel" inputmode="numeric" data-bind="ob.data.emPhone" value="${esc(d.emPhone)}"></div>
    <div class="field"><label for="ob14">Relation</label><input class="input" id="ob14" data-bind="ob.data.emRelation" value="${esc(d.emRelation)}" placeholder="e.g. Brother"></div></div></div>`;
  if(st===3)body=`
   <div class="small muted">Upload a clear photo or a PDF of each document. Photos are compressed automatically. Everything is visible only to the Eldoria care desk.</div>
   ${OB_DOCS.map(x=>{const m=O.docs[x.k],busy=O.busy[x.k];return `<div class="doc-row${m?' done':''}">
     ${busy?`<span class="doc-ph spin" style="width:64px;height:64px">${ic('clock',22)}</span>`:docThumb(m,64)}
     <div class="grow" style="min-width:0"><div style="font-weight:700">${esc(x.label)} ${x.req?'<span class="req">Required</span>':'<span class="muted small">Optional</span>'}</div>
      <div class="small muted">${m?esc(m.name)+' · '+Math.max(1,Math.round(m.size/1024))+' KB':esc(x.hint)}</div></div>
     <label class="btn btn-sm ${m?'':'btn-brand'}" for="doc-${x.k}" style="cursor:pointer">${busy?'Uploading…':m?'Replace':'Upload'}<input id="doc-${x.k}" type="file" accept="image/*,application/pdf" data-doc="${x.k}" hidden></label></div>`}).join('')}`;
  if(st===4){const docsList=OB_DOCS.filter(x=>O.docs[x.k]);
    body=`<div class="card" style="padding:16px"><dl class="kv" style="margin:0"><dt>Name</dt><dd>${esc(d.name)}</dd><dt>Mobile</dt><dd class="num">+91 ${esc(digits(d.phone))}</dd>${d.email?`<dt>Email</dt><dd>${esc(d.email)}</dd>`:''}<dt>Age</dt><dd>${ageOf(d.dob)} · ${esc(d.gender)}</dd><dt>Location</dt><dd>${esc(d.area)}, ${esc(cityName(d.city))}</dd><dt>Role</dt><dd>${esc(d.role)} · ${esc(d.experience)} yrs</dd><dt>Qualification</dt><dd>${esc(d.qualification)}${d.regNo?' · Reg. '+esc(d.regNo):''}</dd><dt>Skills</dt><dd>${esc(d.skills.join(', '))}</dd><dt>Languages</dt><dd>${esc(d.languages.join(', '))}</dd><dt>Available</dt><dd>${esc(d.availability.join(', '))}</dd><dt>Emergency</dt><dd>${esc(d.emName)}${d.emRelation?' ('+esc(d.emRelation)+')':''} · +91 ${esc(digits(d.emPhone))}</dd></dl></div>

/* generic upload: compress photos, accept small PDFs, store in the file store */
async function uploadFile(file,maxDim){
  const isImg=/^image\//.test(file.type),isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name);
  if(!isImg&&!isPdf)throw {msg:'Upload a photo (JPG or PNG) or a PDF.'};
  let data;
  if(isImg)data=await compressImage(file,maxDim||1600,FILE_MAX());
  else{data=await readAsDataURL(file);if(data.length>FILE_MAX())throw {msg:'This PDF is too large. Upload a photo instead; photos are compressed automatically.'}}
  const id='f'+uid(),meta={name:String(file.name||'file').slice(0,80),type:isImg?'image/jpeg':'application/pdf',size:Math.round(data.length*.75)};
  await fileSave(id,{...meta,data});return {id,...meta};
}
async function onHelpFile(file){
  const H=S.help;if(!H||H.files.length>=3)return;H.busy=true;render();
  try{H.files.push(await uploadFile(file,1600))}catch(e){toast(e&&e.msg||'Could not upload that file.')}
  H.busy=false;render();
}

async function onDocPick(key,file){
  const O=S.ob;if(!O||!file)return;
  const isImg=/^image\//.test(file.type),isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name);
  if(!isImg&&!isPdf){toast('Upload a photo (JPG or PNG) or a PDF.');return}
  O.busy[key]=true;O.err='';render();
  try{
    let data;
    if(isImg)data=await compressImage(file,key==='photo'?640:1600,FILE_MAX());
    else{data=await readAsDataURL(file);if(data.length>FILE_MAX())throw {msg:db?'This PDF is too large. Upload a photo of the document instead; photos are compressed automatically.':'This PDF is larger than 2.5 MB. Upload a smaller PDF or a photo.'}}
    const id='f'+uid(),meta={name:String(file.name||'document').slice(0,80),type:isImg?'image/jpeg':'application/pdf',size:Math.round(data.length*.75)};
    await fileSave(id,{...meta,data});
    O.docs[key]={id,...meta};
  }catch(e){toast(e&&e.msg||'Could not upload that file. Try another photo or PDF.')}
  O.busy[key]=false;render();
}

function appDecision(id,status,note){
  const a=D.staff[id];if(!a)return;const now=Date.now();
  const extra=status==='approved'?{approvedAt:now,docs:'verified'}:{};
  patch('staff',id,{approval:status,reviewNote:note||'',reviewedAt:now,...extra,appHistory:(a.appHistory||[]).concat([{at:now,status,by:'admin',note:note||''}])});
  const city=cityName(sCity(a));
  const msg={approved:['Welcome to Eldoria!',`Your application is approved. Sign in to the Staff app to start receiving visits in ${city}.`],
    changes:['Please update your application',note],rejected:['Application not approved',note||'Your application was not approved.'],pending:['Application back under review','The care desk is reviewing your application again.']}[status];
  notify('staff:'+id,msg[0],msg[1],'',{appId:id});
  S.a.appNote='';S.a.confirmReject=null;
}

function svcSubmit(){

  const price=parseInt(digits(f.price)||'0',10);
  if(f.priceMode==='fixed'&&!(price>0)){f.err='Enter a price, or choose “Contact for price”.';return render()}

  const cur=D.services[id]||{};const moved=cur.categoryId!==f.categoryId;
  const order=moved||!f.id?Math.max(0,...svcInCat(f.categoryId,true).map(x=>x.order||0))+1:cur.order;
  put('services',id,{...stripId(cur),name:f.name.trim(),categoryId:f.categoryId,desc:f.desc.trim(),icon:f.icon,image:f.image||null,priceMode:f.priceMode,price:f.priceMode==='fixed'?price:0,unit:f.unit,options:lines(f.options),tasks:lines(f.tasks),enabled:!!f.enabled,order,updatedAt:Date.now()});

function assign(bid,sid,by='admin'){
  const b=D.bookings[bid],st=D.staff[sid];if(!b||!st)return false;const s=svcB(b);
  const prev=b.staffId&&b.staffId!==sid?b.staffId:'';
  const tasks=b.tasks&&b.tasks.length?b.tasks:(s.tasks||[]).map(l=>({label:l,done:false}));
  const now=Date.now();const hist=(b.history||[]).slice();const extra={};
  if(!hist.find(h=>h.status==='confirmed')){hist.push({status:'confirmed',at:now,by});extra.confirmedBy=by;extra.confirmedAt=now}
  hist.push({status:'assigned',at:now,by,staffId:sid});
  patch('bookings',bid,{staffId:sid,status:'assigned',history:hist,tasks,assignedBy:by,assignedAt:now,updatedAt:now,...extra});
  const self=by==='staff:'+sid;
  if(!self)notify('staff:'+sid,'New visit assigned',`${b.patientName} · ${s.name} · ${fmtDate(b.date)}, ${b.time} · ${b.address}${by.startsWith('staff:')?' · assigned by '+actorName(by):''}`,bid);
  if(prev)notify('staff:'+prev,'Visit reassigned',`${b.patientName} · ${fmtDate(b.date)}, ${b.time} has been given to ${st.name}.`,bid);
  notify('client:'+b.clientPhone,'Caregiver assigned',`${st.name} (${st.role}) will visit ${b.patientName} on ${fmtDate(b.date)} at ${b.time}.`,bid);
  if(by!=='admin')notify('admin',`${b.code} ${self?'accepted':'assigned'} by staff`,`${actorName(by)} ${self?'took':'assigned '+st.name+' to'} ${b.patientName}'s ${s.name} visit in ${cityName(bCity(b))} · ${fmtDate(b.date)}, ${b.time}.`,bid);
  toast(self?'Visit accepted · added to your visits':st.name+' assigned to '+b.code);
  return true;
}

   case 'staffConfirmToggle':{const st=settings();put('settings','app',{...stripId(st),staffCanConfirm:!staffCanConfirm()});toast(staffCanConfirm()?'Staff can no longer confirm bookings':'Staff can now confirm and assign bookings');break}
   case 'duty':{const s=D.staff[v];patch('staff',v,{onDuty:!s.onDuty});toast(s.name.split(' ')[0]+(s.onDuty?' is off duty':' is on duty'));break}
   case 'openVisit':S.s.screen='visit';S.s.param=v;render();window.scrollTo(0,0);break;
   case 'vStatus':{const b=D.bookings[v];const extra=el.dataset.k==='in_progress'?{checkInAt:Date.now()}:{};setStatus(b,el.dataset.k,extra,'staff:'+b.staffId);const me=D.staff[b.staffId];const nn=NEXT_NOTE[el.dataset.k];notify('client:'+b.clientPhone,nn[0],`${me?me.name:'Your caregiver'} ${nn[1]} ${b.patientName}.`,b.id);toast(ST[el.dataset.k].label);break}
   case 'vComplete':{const b=D.bookings[v];const V=S.s.vitals[v]||{};setStatus(b,'completed',{checkOutAt:Date.now(),visit:{bp:V.bp||'',sugar:V.sugar||'',spo2:V.spo2||'',note:V.note||''}},'staff:'+b.staffId);const me=D.staff[b.staffId];notify('client:'+b.clientPhone,'Visit completed',`${me?me.name:'Your caregiver'} completed the visit for ${b.patientName}. Tap to see the visit report.`,b.id);notify('admin','Visit completed '+b.code,`${me?me.name:'Staff'} checked out from ${b.patientName}'s visit.`,b.id);toast('Visit completed · family notified');break}
   case 'atab':S.a.tab=v;S.a.param=null;S.a.staffForm=null;S.a.confirmDel=null;if(v!=='newBooking')S.a.form=null;S.a.svcForm=null;S.a.catForm=null;S.a.setForm=null;render();window.scrollTo(0,0);break;
   case 'aOpen':seenAdd('admin',v);S.a.tab='bookings';S.a.param=v;S.a.confirmDel=null;render();window.scrollTo(0,0);break;
   case 'aBack':S.a.param=null;render();break;
   case 'aFilter':S.a.filter=v;render();break;
   case 'aConfirm':{const b=D.bookings[v];setStatus(b,'confirmed',{confirmedBy:'admin',confirmedAt:Date.now()},'admin');notify('client:'+b.clientPhone,'Booking confirmed',`Your ${svcB(b).name} booking ${b.code} is confirmed for ${fmtDate(b.date)}, ${b.time}. We'll assign a caregiver next.`,b.id);toast(b.code+' confirmed');break}
   case 'aNext':{const b=D.bookings[v];const k=el.dataset.k;setStatus(b,k,k==='in_progress'?{checkInAt:Date.now()}:k==='completed'?{checkOutAt:Date.now()}:k==='confirmed'?{confirmedBy:'admin',confirmedAt:Date.now()}:{},'admin');if(NEXT_NOTE[k])notify('client:'+b.clientPhone,NEXT_NOTE[k][0],`${D.staff[b.staffId]?.name||'Your caregiver'} ${NEXT_NOTE[k][1]} ${b.patientName}.`,b.id);else notify('client:'+b.clientPhone,'Booking confirmed',`Your booking ${b.code} is confirmed.`,b.id);toast(ST[k].label);break}
   case 'aCancelAsk':S.a.confirmDel=v;render();break;
   case 'aCancelNo':S.a.confirmDel=null;render();break;
   case 'aCancelYes':{const b=D.bookings[v];setStatus(b,'cancelled',{cancelReason:'Cancelled by care desk'},'admin');notify('client:'+b.clientPhone,'Booking cancelled',`Your booking ${b.code} was cancelled by the care desk. Call us if this is unexpected.`,b.id);if(b.staffId)notify('staff:'+b.staffId,'Visit cancelled',`${b.patientName} · ${fmtDate(b.date)} was cancelled.`,b.id);S.a.confirmDel=null;toast('Booking cancelled');break}
   case 'aStaffNew':S.a.tab='staff';S.a.param=null;S.a.staffForm={name:'',role:'GNM Nurse',phone:'',city:S.a.city!=='all'?S.a.city:cities()[0].id,area:'',skills:'',docs:'pending',err:''};S.a.confirmDel=null;render();window.scrollTo(0,0);break;
   case 'aStaffEdit':{const s=D.staff[v];S.a.staffForm={id:v,name:s.name,role:s.role,phone:s.phone,city:s.city||DEFAULT_CITIES[0].id,area:s.area||'',skills:s.skills||'',docs:s.docs||'pending',err:''};S.a.confirmDel=null;render();window.scrollTo(0,0);break}
   case 'aStaffClose':S.a.staffForm=null;S.a.confirmDel=null;render();break;
   case 'aStaffDelAsk':S.a.confirmDel=v;render();break;
   case 'aStaffDel':{const n=D.staff[v]?.name;remove('staff',v);if(S.staffId===v){S.staffId=null;lsSet('staffId',null)}S.a.staffForm=null;S.a.confirmDel=null;toast((n||'Staff')+' removed');break}
   case 'aCityGo':S.a.city=v;lsSet('adminCity',v);render();window.scrollTo(0,0);break;
   case 'cityEdit':{const c=citiesAll().find(x=>x.id===v);S.a.cityEdit[v]={name:c.name,phone:c.phone||'',whatsapp:c.whatsapp||''};render();break}
   case 'cityCancel':delete S.a.cityEdit[v];render();break;
   case 'cityToggle':{const c=citiesAll().find(x=>x.id===v);if(!c.hidden&&cities().length<=1){toast('Keep at least one live city');break}put('cities',v,{...stripId(c),hidden:!c.hidden});if(S.a.city===v&&!c.hidden){}toast(c.name+(c.hidden?' is live':' paused'));break}
   case 'copy':{const done=()=>toast('Message copied');try{navigator.clipboard.writeText(v).then(done,()=>toast('Select the message text to copy it'))}catch(err){toast('Select the message text to copy it')}break}
  }
});

intro();render();connect();
})();
</script>
