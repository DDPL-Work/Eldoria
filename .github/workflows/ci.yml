name: Backend CI

on:
  push:
    branches: [main, merge]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, merge]
    paths:
      - 'backend/**'
      - '.github/workflows/**'

jobs:
  test:
    name: Node.js ${{ matrix.node-version }} Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    # Run all commands inside backend directory
    defaults:
      run:
        working-directory: ./backend

    env:
      NODE_ENV: test
      JWT_SECRET: test_jwt_secret_min_32_characters_key_2026
      DB_ENV: local
      ENABLE_EXPIRY_CRON: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run code linter
        run: npm run lint

      - name: Run test suite
        run: npm test

      - name: Run build (if configured)
        run: npm run build --if-present

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
